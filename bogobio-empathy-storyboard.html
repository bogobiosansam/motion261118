<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산삼비책 · 공감형 광고 스토리보드</title>
<style>
:root{color-scheme:dark;--bg:#1b1917;--ink:#fff4df;--muted:#c9bba6;--line:#51483d;--accent:#ffd28a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic",sans-serif}
main{max-width:1160px;margin:auto;padding:clamp(20px,5vw,64px)}
header{margin-bottom:24px}
.kicker{font-size:.79rem;color:var(--accent);letter-spacing:.12em}
h1{font-size:clamp(1.65rem,5vw,3.3rem);margin:.28em 0;letter-spacing:-.065em}
p{line-height:1.65;margin:.35em 0}
header p,.notes p{color:var(--muted)}
.choices,.controls,.scenes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;color:inherit;border:1px solid var(--line);background:#28241f;border-radius:7px;padding:.58rem .83rem;cursor:pointer;min-height:44px}
button[aria-pressed=true],#play{background:var(--accent);color:#241a13;border-color:transparent}
.stage{margin-top:14px;aspect-ratio:16/9;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden;container-type:inline-size;background:#382218;transition:background .3s}
.stage[data-tone=busy]{background:radial-gradient(ellipse at 70% 0%,#5a4c36,#27241f 76%)}
.stage[data-tone=pause]{background:radial-gradient(ellipse at 50% 95%,#553a29,#261d18 75%)}
.stage[data-tone=turn]{background:radial-gradient(ellipse at 60% 25%,#71422b,#301d17 76%)}
.stage[data-tone=product]{background:radial-gradient(ellipse at 65% 45%,#852e36,#401a25 76%)}
.stage[data-tone=brand]{background:radial-gradient(ellipse at 52% 70%,#533124,#201814 78%)}
.cue{position:absolute;inset:8% 7% auto;display:flex;justify-content:space-between;font-size:clamp(.6rem,2.25cqw,1rem);color:#ffdbac}
.copy{padding:0 7%;font-size:clamp(1rem,6.4cqw,5rem);font-weight:800;line-height:1.18;letter-spacing:-.065em}
.copy span{display:block}
.copy strong{display:block;color:var(--accent);font-size:1.12em}
.ingredient{position:absolute;bottom:8%;left:8%;right:8%;font-size:clamp(.63rem,2.15cqw,1rem);color:#fff4df}.copy.enter span{animation:rise .45s both}
.copy.enter strong{animation:rise .5s .12s both}
@keyframes rise{from{transform:translateY(18px) scale(.91);opacity:0} to{transform:translateY(0) scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.controls{margin:12px 0;gap:12px}
#seek{flex:1;min-width:95px;accent-color:var(--accent)}
#clock{font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.scenes button{font-size:.85rem}
.notes{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.notes b{display:block;color:var(--accent)}
@media(max-width:560px){.notes{grid-template-columns:1fr}.scenes button{font-size:.78rem}}
</style>
</head>
<body><main>
<header><div class="kicker">보고바이오 · 30초 광고 스토리보드</div><h1>내 하루에도 들어갈 수 있을까?</h1><p>두 소비자 상황을 같은 30초 길이로 비교합니다. 기본 시안은 늘 미뤄지는 내 일상입니다.</p></header>
<div class="choices" aria-label="스토리 비교">
<button type="button" data-variant="routine" aria-pressed="true">A · 바쁜 내 일상</button>
<button type="button" data-variant="gift" aria-pressed="false">B · 부모님 선물 고민</button>
</div>
<section class="stage" id="stage" data-tone="busy" aria-label="16:9 타이포 애니매틱">
<div class="cue"><span id="cue"></span><span>30초 · 16:9</span></div>
<div class="copy" id="copy"><span id="lead"></span><strong id="emphasis"></strong></div><div id="ingredient" class="ingredient" hidden>자연산삼에서 배양한 뿌리를 원료로 사용 · 한 포 20 mL</div>
</section>
<div class="controls"><button type="button" id="play">재생</button><input type="range" id="seek" min="0" max="30" value="0" step="0.1" aria-label="재생 위치, 초"><output id="clock" for="seek">00.0 / 30초</output></div>
<nav class="scenes" id="scenes" aria-label="장면 선택"></nav>
<section class="notes" aria-live="polite">
<div><b>화면과 소리</b><p id="direction"></p></div>
<div><b>시청자에게 남길 생각</b><p id="intent"></p></div>
</section>
</main>
<script>
const versions={
routine:[
 [0,'01 · 멈춰 보기','busy','내일은 내 몸 좀 챙겨야지.','…어제도 그 말 했는데.','휴대폰 알림처럼 첫 문장이 뜨고, 짧은 무음 뒤 두 번째 문장이 한 박 늦게 커진다.','나도 맨날 내일부터라고 하는데.'],
 [4,'02 · 내 하루','busy','알람 끄고. 커피 들고.','또 뛰어나간다.','알람, 머그잔, 현관 열쇠를 짧게 교차한다. 세 동작에 맞춰 가벼운 퍼커션을 얹는다.','내가 아침에 하는 행동과 똑같다.'],
 [9,'03 · 작은 전환','pause','내가 나를 챙기는 일은','왜 늘 맨 마지막일까.','현관에서 가방을 여는 손에 잠깐 멈춘다. 음악의 드럼을 한 박 비운다.','시간을 더 내야 한다는 부담부터 든다.'],
 [14,'04 · 가방 옆 한 포','turn','내일로 미루지 않게.','가방 옆에, 한 포.','열쇠 옆에 실제 산삼비책 스틱을 두고 가방에 넣는다. 여기서 실물이 처음 등장한다.','이미 하는 행동에 붙이면 나도 해볼 만하다.'],
 [20,'05 · 제품 확인','product','산삼에서 시작한 한 포.','천삼정 산삼비책','실제 스틱과 패키지를 짧게 보여준다. 하단에는 자연산삼에서 배양한 뿌리를 원료로 사용했다는 설명과 한 포 20 mL를 표시한다.','방금 가방에 넣은 제품이 무엇인지 알겠다.'],
 [26,'06 · 다음 행동','brand','보고바이오 · 산삼비책','라인업 보기','두 패키지와 bogobiomall.com을 4초간 유지한다. 마지막 코드는 단정하게 끝낸다.','관심이 생기면 제품을 더 살펴볼 수 있다.']
],
gift:[
 [0,'01 · 멈춰 보기','busy','부모님 선물,','장바구니에만 며칠째.','‘배송지’와 ‘선물 포장’ 사이를 오가는 손을 보여준다. 두 번째 문장을 비트에 맞춰 확대한다.','나도 마음에 드는 걸 못 골라서 미뤄뒀다.'],
 [4,'02 · 익숙한 대화','busy','“뭐 필요한 거 있어?”','“나는 됐어.”','통화가 끝난 화면을 잡고 익숙한 대답 뒤 음악을 잠시 비운다.','우리 부모님도 늘 그렇게 말씀하신다.'],
 [9,'03 · 선물의 기준','pause','받고 나서도','손이 자주 가는 선물.','식탁 위 안경, 작은 컵, 선물 자리를 따뜻한 아침빛으로 연결한다.','부담 없이 꺼내 쓸 수 있는 걸 드리고 싶다.'],
 [14,'04 · 건네는 순간','turn','필요한 거 물어보는 대신,','이번엔 직접 건네기.','두 사람이 식탁에 앉고 실제 산삼비책 패키지를 건넨다. 여기서 실물이 처음 등장한다.','다음에 찾아뵐 때 가져가면 좋겠다.'],
 [20,'05 · 제품 확인','product','한 포씩 꺼내는','천삼정 산삼비책','상자를 열고 실제 스틱 한 포를 꺼내는 동작을 보여준다.','어떤 선물인지, 어떻게 꺼내 쓰는지 알겠다.'],
 [26,'06 · 다음 행동','brand','보고바이오 · 산삼비책','라인업 보기','실제 제품과 bogobiomall.com을 4초간 유지한다.','구성을 보고 선물을 고를 수 있다.']
]};
const byId=id=>document.getElementById(id);
const seek=byId('seek'), clock=byId('clock'), play=byId('play'), stage=byId('stage'), copy=byId('copy'), nav=byId('scenes');
const tabs=[...document.querySelectorAll('[data-variant]')];
let variant='routine', time=0, current=-1, running=false, start=0, raf=0, sceneButtons=[];
function show(position){
 time=Math.min(30,Math.max(0,position));
 seek.value=time;
 clock.textContent=time.toFixed(1).padStart(4,'0')+' / 30초';
 const steps=versions[variant];
 let index=0;
 while(index+1<steps.length&&time>=steps[index+1][0]) index++;
 if(index===current)return;
 current=index;
 const [point,label,tone,lead,emphasis,direction,intent]=steps[index];
 stage.dataset.tone=tone;
 byId('ingredient').hidden=tone!=='product'||variant!=='routine';
 byId('cue').textContent=label.slice(5);
 byId('lead').textContent=lead;
 byId('emphasis').textContent=emphasis;
 if(index===steps.length-1) byId('emphasis').textContent=emphasis+' · bogobiomall.com';
 byId('direction').textContent=direction;
 byId('intent').textContent=intent;
 copy.classList.remove('enter');
 void copy.offsetWidth;
 copy.classList.add('enter');
 sceneButtons.forEach((button,i)=>button.setAttribute('aria-pressed',i===index));
}
function pause(){
 running=false;cancelAnimationFrame(raf);play.textContent=time>=30?'다시 재생':'재생';
}
function tick(now){
 if(!running)return;
 show((now-start)/1000);
 if(time>=30){pause();return;}
 raf=requestAnimationFrame(tick);
}
function select(key){
 pause();
 variant=key;current=-1;
 tabs.forEach(tab=>tab.setAttribute('aria-pressed',tab.dataset.variant===key));
 nav.replaceChildren();
 sceneButtons=versions[key].map(([point,label])=>{
  const b=document.createElement('button');
  b.type='button';b.textContent=point+'초 · '+label.slice(5);
  b.addEventListener('click',()=>{show(point);if(running)start=performance.now()-time*1000;else pause();});
  nav.append(b);return b;
 });
 show(0);play.textContent='재생';
}
tabs.forEach(tab=>tab.addEventListener('click',()=>select(tab.dataset.variant)));
seek.addEventListener('input',()=>{show(Number(seek.value));if(running)start=performance.now()-time*1000;else pause();});
play.addEventListener('click',()=>{
 if(running){pause();return;}
 if(time>=30)show(0);
 running=true;start=performance.now()-time*1000;play.textContent='일시정지';raf=requestAnimationFrame(tick);
});
select(variant);
</script>
</body></html>
